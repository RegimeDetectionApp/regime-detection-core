[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-detection-core"
version = "0.1.0"
description = "Core domain: Gaussian HMM fitting, regime detection, and walk-forward validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "hmmlearn>=0.3",
    "scikit-learn>=1.3",
]

[project.urls]
Repository = "https://github.com/govid13427742/regime-detection-core"

[tool.setuptools.packages.find]
include = ["regime_detection_core*"]
